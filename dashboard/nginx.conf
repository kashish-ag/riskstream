server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Producer control API (more specific prefix wins over /api/)
  location /api/producer/ {
    proxy_pass http://producer:8081;
  }

  # Server-Sent Events: buffering must be off or alerts arrive in delayed clumps
  location /api/alerts/stream {
    proxy_pass http://risk-service:8082;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://risk-service:8082;
  }
}
