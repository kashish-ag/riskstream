server:
  port: 8082

spring:
  application:
    name: riskstream-risk-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: risk-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns undeserializable messages into recoverable errors
      # (routed to the dead-letter topic) instead of an endless failure loop.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.riskstream.common.Transaction
        spring.json.use.type.headers: false
        spring.json.trusted.packages: io.riskstream.common
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    listener:
      concurrency: 3   # one consumer thread per partition of the transactions topic

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
