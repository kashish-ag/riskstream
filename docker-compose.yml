# riskstream — one command to run everything:  docker compose up --build
# Dev mode (run the Java services from your IDE/Maven instead):  docker compose up kafka redis
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: riskstream-kafka
    ports:
      - "9092:9092"            # host access (Maven / IDE runs)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller       # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"          # keeps a laptop happy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: riskstream-redis
    # volatile-lru: under memory pressure only keys with a TTL (e.g. idempotency markers) are evicted
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: riskstream-producer
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PRODUCER_TPS: 20
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy

  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    container_name: riskstream-risk-service
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    container_name: riskstream-dashboard
    ports:
      - "3000:80"
    depends_on:
      - risk-service
      - producer
